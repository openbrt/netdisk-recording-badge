name: Publish installer
on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: [main]
    paths: ["site/**", "tools/prepare_site.py", "assets/images/netdisk-recording-cover.png", ".github/workflows/pages.yml"]
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    # The first push precedes creation of the approved Release assets.
    if: github.event_name != 'push' || github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Test browser serial protocol
        run: node --test tests/test_web_serial.mjs
      - name: Stage and verify approved release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/prepare_site.py
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
